<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Livechat – Ouverture du lien</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --border: #2c2c2c;
      --text: #ffffff;
      --muted: #a0a0a0;
      --blue: #0078f2;
      --blue-h: #1a8cff;
      --accent: #3d5a3a;
      --danger: #e07070;
      --ok: #7dcea0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1a2a3a;
      color: #70b0e0;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }
    p {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
      margin: 0 0 16px;
    }
    button, .btn {
      display: inline-block;
      width: 100%;
      border: none;
      border-radius: 24px;
      height: 48px;
      line-height: 48px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      background: var(--blue);
      margin-top: 8px;
      transition: background .15s;
    }
    button:hover, .btn:hover { background: var(--blue-h); }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 600;
      margin-top: 10px;
    }
    button.secondary:hover {
      background: #2a2a2a;
      color: var(--text);
    }
    .status {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.2em;
      white-space: pre-wrap;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .meta {
      margin-top: 18px;
      font-size: 0.75rem;
      color: #666;
      line-height: 1.4;
    }
    code {
      background: #181818;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">/link · protocole livechat://</div>
    <h1>Λ  Ouverture Livechat</h1>
    <p id="subtitle">
      Connexion au Launcher en cours…
    </p>
    <button type="button" id="openBtn">Ouvrir dans Livechat</button>
    <button type="button" class="secondary" id="copyBtn">Copier le token</button>
    <div class="status" id="status"></div>
    <div class="meta">
      Si rien ne s’ouvre : installe <strong>Setup.exe</strong> une fois<br>
      (enregistre le protocole <code>livechat://</code>), puis réessaie.
    </div>
  </div>

  <script>
    // Payload after # — same pattern as /link buttons (Discord rejects custom schemes)
    const rawHash = (location.hash || "").replace(/^#/, "");
    let token = "";
    try {
      token = decodeURIComponent(rawHash || "").trim();
    } catch (e) {
      token = (rawHash || "").trim();
    }

    const statusEl = document.getElementById("status");
    const subtitle = document.getElementById("subtitle");
    const openBtn = document.getElementById("openBtn");
    const copyBtn = document.getElementById("copyBtn");

    function setStatus(msg, kind) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function isValidToken(t) {
      return t && t.length > 40 && t.indexOf(".") !== -1;
    }

    // Launcher accepts: livechat://link/TOKEN  or raw TOKEN
    function protocolUrl(t) {
      return "livechat://link/" + encodeURIComponent(t);
    }

    function tryOpen(t) {
      if (!isValidToken(t)) {
        setStatus(
          "Lien invalide ou incomplet.\nRelance /link sur Discord.",
          "err"
        );
        subtitle.textContent = "Impossible d’ouvrir ce lien.";
        openBtn.disabled = true;
        copyBtn.disabled = true;
        return false;
      }
      const url = protocolUrl(t);
      setStatus("Tentative d’ouverture du Launcher…", "");
      // Hidden iframe + location fallback (best-effort across browsers)
      try {
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = url;
        document.body.appendChild(iframe);
        setTimeout(function () {
          try { iframe.remove(); } catch (e) {}
        }, 2000);
      } catch (e) {}
      try {
        window.location.href = url;
      } catch (e) {}
      setTimeout(function () {
        setStatus(
          "Si le Launcher ne s’est pas ouvert, clique « Ouvrir dans Livechat ».\n" +
          "Sinon vérifie que le Setup a bien enregistré livechat://.",
          ""
        );
      }, 1200);
      return true;
    }

    openBtn.addEventListener("click", function () {
      tryOpen(token);
    });

    copyBtn.addEventListener("click", function () {
      if (!token) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(token).then(function () {
          setStatus("Token copié dans le presse-papiers.", "ok");
        }).catch(function () {
          setStatus("Copie impossible — sélectionne le token manuellement.", "err");
        });
      } else {
        setStatus("Copie non supportée par ce navigateur.", "err");
      }
    });

    if (!isValidToken(token)) {
      subtitle.textContent = "Lien invalide ou expiré.";
      setStatus(
        "Aucun payload valide dans l’URL.\nUtilise le bouton fourni par /link sur Discord.",
        "err"
      );
      openBtn.disabled = true;
      copyBtn.disabled = true;
    } else {
      subtitle.textContent =
        "Ce lien configure ton Livechat (serveurs + token) via le Launcher.";
      // Auto-open once
      tryOpen(token);
    }
  </script>
</body>
</html>
