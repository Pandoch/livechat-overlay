<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Livechat – Ouverture du Setup</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #1e1e1e;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 420px;
      background: #2a2a2a;
      border-radius: 12px;
      padding: 28px 24px;
      border: 1px solid #3c3c3c;
    }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p { color: #aaa; font-size: 0.95rem; line-height: 1.45; }
    a.btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      background: #3d5a3a;
      color: #fff;
      text-decoration: none;
      border-radius: 22px;
      font-weight: 600;
    }
    a.btn:hover { background: #4a6b45; }
    code {
      display: block;
      margin-top: 14px;
      padding: 10px;
      background: #181818;
      border-radius: 8px;
      font-size: 0.7rem;
      word-break: break-all;
      color: #9cdcfe;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Λ Livechat Setup</h1>
    <p id="status">Ouverture du protocole Livechat…</p>
    <a class="btn" id="manual" href="#" style="display:none">Ouvrir le Setup manuellement</a>
    <code id="raw" style="display:none"></code>
  </div>
  <script>
    (function () {
      // Token passé en fragment : open.html#TOKEN
      var token = (location.hash || "").replace(/^#/, "").trim();
      if (!token) {
        document.getElementById("status").textContent =
          "Lien invalide ou expiré. Relance /link dans Discord.";
        return;
      }
      var protocolUrl = "livechat://link/" + token;
      var manual = document.getElementById("manual");
      var raw = document.getElementById("raw");
      manual.href = protocolUrl;
      manual.style.display = "inline-block";
      raw.textContent = protocolUrl;
      raw.style.display = "block";

      // Tentative d'ouverture automatique du protocole Windows
      try {
        window.location.href = protocolUrl;
      } catch (e) {}

      // Message de secours après un court délai
      setTimeout(function () {
        document.getElementById("status").innerHTML =
          "Si le Setup ne s'est pas ouvert :<br>" +
          "1. Clique le bouton ci-dessous<br>" +
          "2. Ou copie le lien et colle-le dans la barre d'adresse / Win+R<br>" +
          "3. Vérifie que Setup.exe a bien été lancé une fois (protocole enregistré).";
      }, 800);
    })();
  </script>
</body>
</html>
