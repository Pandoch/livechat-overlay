<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Livechat – Ouverture</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif; background: #121212; color: #fff;
    }
    .box { text-align: center; max-width: 420px; padding: 24px; }
    a { color: #70b0e0; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Λ Livechat</h2>
    <p id="msg">Ouverture du Launcher…</p>
    <p style="color:#666;font-size:0.85rem">Si rien ne se passe, lance le Setup une fois puis réessaie.</p>
  </div>
  <script>
    (function () {
      var token = (location.hash || "").replace(/^#/, "").trim();
      if (!token) {
        document.getElementById("msg").textContent = "Lien invalide.";
        return;
      }
      var url = "livechat://link/" + encodeURIComponent(token);
      var iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = url;
      document.body.appendChild(iframe);
      setTimeout(function () {
        try { window.location.href = url; } catch (e) {}
      }, 200);
    })();
  </script>
</body>
</html>
