<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Aucune ressource externe, aucun envoi : seule cette page et son script (empreinte) sont autorisés. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-CB9ACMc+oWsHOnseYztaIAuHtc+RswYEFgKMTC3CmHQ='; form-action 'none'; base-uri 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Livechat – Ouverture</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: "Segoe UI", system-ui, sans-serif; background: #121212; color: #fff; }
    .box { text-align: center; max-width: 440px; padding: 24px; }
    button { margin-top: 12px; padding: 10px 22px; border: 0; border-radius: 10px; background: #00C853; color: #06240F;
             font: 600 15px "Segoe UI", sans-serif; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    small { color: #777; display: block; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Λ Livechat</h2>
    <p id="msg">Ouverture du Launcher…</p>
    <button id="open" hidden>Ouvrir le Launcher</button>
    <small>Si rien ne se passe, installe Livechat puis clique sur le bouton.<br>
           Ce lien est à usage unique et expire après 10 minutes : ne le partage pas.</small>
  </div>
  <script>(function () {
  "use strict";
  // 1) Lire le lien puis l'effacer IMMÉDIATEMENT de la barre d'adresse et de l'historique.
  var token = (location.hash || "").replace(/^#/, "").trim();
  try { history.replaceState(null, "", location.pathname); } catch (e) {}

  var msg = document.getElementById("msg");
  var btn = document.getElementById("open");
  // 2) N'accepter que la forme d'un lien Livechat v2 ("L2…" + "." + signature, base64url).
  if (!/^L2[A-Za-z0-9_-]{40,4000}\.[A-Za-z0-9_-]{16,64}$/.test(token)) {
    msg.textContent = "Lien invalide ou incomplet. Relance /lier dans Discord.";
    return;
  }
  var url = "livechat://link/" + token;
  token = null;
  function open() { try { window.location.href = url; } catch (e) {} }
  btn.onclick = function () { open(); };
  btn.hidden = false;
  open();
  // 3) Le lien ne reste en mémoire que le temps de l'ouverture.
  setTimeout(function () { url = null; btn.disabled = true; msg.textContent = "Tu peux fermer cet onglet."; }, 60000);
})();
</script>
</body>
</html>
